###############################################################################
#
# snmpd.conf — минимальный рабочий конфиг snmpd для устройств под наблюдением.
# Скопируй на устройство в /etc/snmp/snmpd.conf (Linux) или используй как
# образец для macOS.
#
###############################################################################

# Доступ community "public" ко всем MIB-веткам.
# Ключ — флаг -V all: он открывает все MIB, включая LLDP. Без него Observium
# не увидит LLDP-соседей и не построит карту сети.
rocommunity public default -V all

# Местоположение и контакт (укажи свои значения)
syslocation "Yekaterinburg, Russia"
syscontact admin@example.com

# Не засорять логи предупреждениями о TCP Wrappers
dontLogTCPWrappersConnects yes
